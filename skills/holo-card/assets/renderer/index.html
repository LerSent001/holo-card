<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Holo Card</title><link rel="stylesheet" href="viewer.css?access=__ACCESS__"></head><body><main class="room"><div class="stage"><div class="card" tabindex="0" role="button" aria-label="Click to flip, drag to rotate, or use arrow keys"><div class="face front"><canvas></canvas></div><div class="face back"><img alt="Card back" draggable="false"></div></div></div><aside class="controls" aria-label="Card effects"><label for="depth">Depth</label><div class="depth-track"><input id="depth" type="range" min="-3" max="3" step="0.05" value="0"><span class="depth-ticks" aria-hidden="true"><span></span><span>0</span><span></span></span></div><output for="depth">0.00×</output><label for="brightness">Contour glow</label><input id="brightness" type="range" min="0" max="3" step="0.05" value="0.15"><output for="brightness">0.15×</output></aside><p class="status" role="status">Loading card…</p></main><script type="module" src="viewer.js?access=__ACCESS__"></script></body></html>
